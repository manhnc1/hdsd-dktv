<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hướng dẫn sử dụng DKTV - Trang chung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0F2350;--blue:#194792;--blue2:#0A6FD0;--cyan:#00A9E8;--orange:#F59E0B;--green:#16A34A;--red:#C0352B;--ink:#1F2937;--muted:#5B6B82;--tint:#EAF3FC;--line:#C9D7EA}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;background:#fff}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px}.top img{height:38px}.top .sp{flex:1}.crumb{font-size:12.5px;color:var(--muted)}
.lang button{font:700 12px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:6px 12px;cursor:pointer}.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}.lang button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 0}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
h1{margin:4px 0 6px;font-size:26px;text-transform:uppercase;color:var(--navy)}.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:4px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.pur{margin:0 0 18px;font-size:16px}.pur b{color:var(--blue)}
.grid{display:grid;grid-template-columns:minmax(320px,.8fr) 1.4fr;gap:22px;align-items:start}
.card{background:var(--tint);border-radius:14px;padding:18px}.card h2{margin:0 0 6px;font-size:15px;color:var(--navy);text-transform:uppercase}
ol{list-style:none;padding:0;margin:0;counter-reset:s}ol li{counter-increment:s;position:relative;padding:10px 12px 10px 46px;border-radius:10px;cursor:pointer;font-size:14px}ol li:before{content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--cyan);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
ol li.on{background:#fff;box-shadow:0 2px 8px rgba(15,35,80,.12)}ol li.on:before{background:var(--orange)}
.btn{font-weight:700;font-size:12.5px;color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;padding:0 6px;background:#fff}
.done{margin-top:12px;border-left:4px solid var(--green);background:#fff;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;cursor:pointer}.done.on{box-shadow:0 2px 8px rgba(15,35,80,.12)}.done>b:first-child{color:var(--green)}
.warn{margin-top:10px;border-left:4px solid var(--red);background:#fff;border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px}
.fig{position:sticky;top:64px;background:var(--blue);border-radius:14px;padding:16px;color:#fff;box-shadow:0 6px 18px rgba(15,35,80,.25)}.fig .eyebrow{color:var(--orange)}
.shot{position:relative;margin-top:8px;border-radius:8px;overflow:hidden;background:#fff}.shot img{display:block;width:100%}
.hl{position:absolute;border:3px solid var(--orange);border-radius:6px;box-shadow:0 0 0 2000px rgba(15,35,80,.18);transition:all .25s}.hl i{position:absolute;top:-13px;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font:700 12px Montserrat,sans-serif;display:grid;place-items:center}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs button{font:700 12px Montserrat,sans-serif;border:1.5px solid #fff;background:transparent;color:#fff;padding:5px 12px;cursor:pointer}.tabs button:first-child{border-radius:8px 0 0 8px}.tabs button:last-child{border-radius:0 8px 8px 0;border-left:0}.tabs button[aria-pressed=true]{background:#fff;color:var(--blue)}.vid{margin-top:8px;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9}.vid iframe{width:100%;height:100%;border:0;display:block}.cap{font-size:12px;color:#D6E8FA;margin-top:8px}.clip{margin-top:10px;font-size:12.5px;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 12px}
h3{font-size:17px;text-transform:uppercase;color:var(--navy);margin:34px 0 8px}table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--red);color:#fff;text-align:left;padding:9px 12px}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.see{color:var(--blue);font-weight:600;font-size:14px}footer{margin-top:44px;position:relative;height:50px}footer:before{content:"";position:absolute;inset:0 0 0 12%;background:linear-gradient(90deg,#1B5FC0,#194792 40%,#12336F);clip-path:polygon(28px 0,100% 0,100% 100%,0 100%)}footer div{position:absolute;right:26px;top:16px;color:#fff;font-size:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.fig{position:static;order:-1}h1{font-size:20px}.crumb{display:none}}
.pick{max-width:1240px;margin:0 auto;padding:14px 20px 0}.pick h2{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.grp{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}.grp span{font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;min-width:112px}.grp button{font:600 12.5px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:5px 12px;cursor:pointer}.grp button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}#trw[hidden],#tClip[hidden],#clip[hidden],#warn[hidden]{display:none}

/* ---- bo cuc thanh ben (phuong an A) ---- */
.pick{position:fixed;left:0;top:55px;bottom:0;width:290px;overflow:auto;border-right:1px solid var(--line);padding:14px 14px 40px;margin:0;background:#F7FAFE;max-width:none;z-index:4}
.grp{display:block;margin-bottom:14px}.grp span{display:block;margin:0 0 4px 10px}
.grp button{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;padding:7px 10px;font-weight:500;font-size:13.5px}
.grp button:hover{background:var(--tint)}.grp button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:700}
.roles{display:flex;margin:0 0 14px;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}.roles a{flex:1;text-align:center;padding:7px 6px;font-size:12.5px;font-weight:700;color:var(--navy);text-decoration:none;background:#fff}.roles a.on{background:var(--navy);color:#fff}
.wrap{margin-left:290px;max-width:none;padding:22px 32px 0}footer{margin-left:290px}.grid{grid-template-columns:minmax(300px,.7fr) 1.5fr}h1{font-size:24px}
#menu{display:none;font:700 13px Montserrat,sans-serif;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:6px 10px;cursor:pointer}
.back{display:none}.pn{display:flex;justify-content:space-between;gap:10px;margin:22px 0 0}.pn button{font:700 13px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:9px 14px;cursor:pointer;max-width:48%;text-align:left}.pn button:last-child{text-align:right;margin-left:auto}.pn button[disabled]{visibility:hidden}
@media(max-width:860px){
.pick{top:0;width:86vw;max-width:340px;transform:translateX(-102%);transition:transform .2s;z-index:30;box-shadow:6px 0 24px rgba(15,35,80,.3);padding-top:18px}
body.open .pick{transform:none}.back{position:fixed;inset:0;background:rgba(15,35,80,.45);z-index:25}body.open .back{display:block}
.wrap,footer{margin-left:0}.wrap{padding:16px 14px 0}.grid{grid-template-columns:1fr}h1{font-size:20px}#menu{display:inline-flex}.top{padding:8px 12px;gap:10px}.top img{height:30px}
.grp button{padding:10px 10px;font-size:14.5px}ol li{font-size:15px}.pur{font-size:15px}.pn button{font-size:12.5px}
}
.xdoc{display:block;margin:0 0 16px;padding:10px 12px;border:1.5px solid #00A9E8;border-radius:10px;background:#EAF3FC;text-decoration:none;color:var(--navy)}.xdoc b{display:block;font:700 13px/1.3 Montserrat,sans-serif}.xdoc span{display:block;font-size:11.5px;color:#5B6B82;margin-top:4px}.xdoc:hover{background:#D6E8FA}

.sec{scroll-margin-top:70px;margin-bottom:38px}.sec h2{font-size:19px;text-transform:uppercase;color:var(--navy);margin:0 0 6px}.sec>p{margin:0 0 14px;color:var(--muted)}
.flow{display:flex;gap:6px;flex-wrap:wrap}.flow button{flex:1 1 130px;font:700 13px Montserrat,sans-serif;border:0;color:#fff;background:var(--blue);padding:14px 10px 14px 22px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);text-align:center}
.flow button i{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.8}.flow button[aria-pressed=true]{background:var(--orange)}
.sd{margin-top:14px;background:var(--tint);border-radius:14px;padding:16px 18px}.sd dl{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;margin:0}.sd dt{font-weight:700;color:var(--navy);font-size:13px}.sd dd{margin:0;font-size:14px}
.sd a,.fa a{display:inline-block;font:700 12px Montserrat,sans-serif;color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;padding:1px 7px;margin:0 6px 4px 0;text-decoration:none;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:12.5px;border-radius:14px;padding:3px 11px;white-space:nowrap}
.sec table th{background:var(--navy)}.sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);margin:18px 0 6px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fbar input{flex:1 1 260px;font:500 14px Montserrat,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}.fbar button{font:700 12.5px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;cursor:pointer}.fbar button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;color:var(--navy)}summary em{font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;color:#fff;border-radius:4px;padding:2px 7px;margin-right:8px;background:var(--cyan)}summary em.cb{background:var(--blue)}.fa{padding:0 14px 12px;font-size:14px}.fa p{margin:0 0 8px}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.ct div{background:var(--tint);border-radius:12px;padding:14px 16px;font-size:14px}.ct b{display:block;color:var(--navy);margin-bottom:4px}
.roles a{font-size:11.5px}@media(max-width:860px){.sd dl{grid-template-columns:1fr}.sd dt{margin-top:6px}.sec table{font-size:12.5px}}
</style></head><body>

<script>var D={"ST": [[["Gửi hồ sơ", "Submit"], ["Người nộp hồ sơ", "Applicant"], ["member.vifc.gov.vn - Tạo hồ sơ", "member.vifc.gov.vn - Tạo hồ sơ (create a dossier)"], ["Kiểm tra hồ sơ, Gửi; chưa xong thì Lưu", "Kiểm tra hồ sơ (check), Gửi (send); Lưu (save) keeps a draft"], ["Khung TIẾN ĐỘ PHÊ DUYỆT hiện ở đầu hồ sơ; nút Thu hồi dùng để rút lại.", "The TIẾN ĐỘ PHÊ DUYỆT (approval progress) panel appears at the top; Thu hồi withdraws the dossier."], [["nguoi-nop.html#hd-dn-10", "HD.DN.10"], ["nguoi-nop.html#hd-dn-11", "HD.DN.11"], ["nguoi-nop.html#hd-dn-13", "HD.DN.13"]]], [["Tiếp nhận", "Reception"], ["Bộ phận một cửa", "One-stop desk"], ["QL Yêu Cầu - khung Cần xử lý", "QL Yêu Cầu - the Cần xử lý (to process) panel"], ["Hồ sơ đầy đủ, Bổ sung thông tin, Chuyển xử lý, Từ chối", "Hồ sơ đầy đủ (complete), Bổ sung thông tin (request supplement), Chuyển xử lý (forward), Từ chối (reject)"], ["Bước Kiểm tra hồ sơ đang chờ (màu vàng). Nếu bị yêu cầu bổ sung, hồ sơ về mục Yêu cầu đã nhận.", "The Kiểm tra hồ sơ step is waiting (yellow). If a supplement is requested, the dossier returns under Yêu cầu đã nhận."], [["can-bo.html#hd-cb-07", "HD.CB.07"], ["nguoi-nop.html#hd-dn-14", "HD.DN.14"]]], [["Thẩm định", "Appraisal"], ["Chuyên viên Ban Thành viên phụ trách hồ sơ; Ban Pháp chế cho ý kiến", "Member Department officer in charge; Legal Department gives its opinion"], ["QL Hồ sơ - hồ sơ ở trạng thái Thẩm định", "QL Hồ sơ - dossier in status Thẩm định"], ["Chọn người xử lý cho từng công việc con; Đã hoàn tất khi xong việc; lập PHIẾU TIẾP NHẬN HỒ SƠ", "Chọn người xử lý on each sub-task; Đã hoàn tất when done; issue PHIẾU TIẾP NHẬN HỒ SƠ (dossier receipt)"], ["Dòng Trạng thái ghi Đã phê duyệt. Người nộp không cần thao tác thêm.", "The status line reads Đã phê duyệt. No further action is needed from the applicant."], [["can-bo.html#hd-cb-08", "HD.CB.08"], ["can-bo.html#hd-cb-09", "HD.CB.09"], ["can-bo.html#hd-cb-10", "HD.CB.10"]]], [["Ra quyết định", "Decision"], ["Chuyên viên trình; Trưởng, Phó ban và Ban Chủ tịch duyệt", "Officer submits; head, deputy head and the Presidium approve"], ["QL Hồ sơ (chuyên viên); QL Yêu Cầu - Chờ phê duyệt (người duyệt)", "QL Hồ sơ (officer); QL Yêu Cầu - Chờ phê duyệt (approvers)"], ["Lưu, Gửi trên phiếu Quyết định; Đồng ý (Trưởng, Phó ban), Phê duyệt (Ban Chủ tịch), Từ chối", "Lưu, Gửi on the decision form; Đồng ý (heads), Phê duyệt (Presidium), Từ chối"], ["Chưa có thay đổi phía người nộp.", "Nothing changes on the applicant side yet."], [["can-bo.html#hd-cb-11", "HD.CB.11"], ["can-bo.html#hd-cb-13", "HD.CB.13"]]], [["Cấp giấy chứng nhận", "Certificate"], ["Chuyên viên Ban Thành viên; Ban Chủ tịch duyệt", "Member Department officer; the Presidium approves"], ["QL Hồ sơ - hồ sơ ở trạng thái Cấp giấy chứng nhận", "QL Hồ sơ - dossier in status Cấp giấy chứng nhận"], ["Lập B2, TỜ TRÌNH GIẤY CHỨNG NHẬN, THÔNG BÁO GIẤY CHỨNG NHẬN ĐẾN THÀNH VIÊN; làm hai công việc con B1, B3", "Create B2, the certificate submission and the certificate notice to the member; complete sub-tasks B1 and B3"], ["Thông báo giấy chứng nhận được gửi tới mục Yêu cầu đã nhận.", "The certificate notice arrives under Yêu cầu đã nhận."], [["can-bo.html#hd-cb-12", "HD.CB.12"]]], [["Hoàn thành", "Completed"], ["Chuyên viên Ban Thành viên chuyển trạng thái", "Member Department officer changes the status"], ["QL Hồ sơ; trang công khai Thông tin Thành viên", "QL Hồ sơ; the public Member Information page"], ["Ô trạng thái - Hoàn thành, sau khi các phiếu đã duyệt và B1, B3 đã Đã hoàn tất", "Status box - Hoàn thành, once the forms are approved and B1, B3 are done"], ["Doanh nghiệp hiện ở member.vifc.gov.vn/member-information.", "The enterprise is listed at member.vifc.gov.vn/member-information."], [["nguoi-nop.html#hd-dn-15", "HD.DN.15"], ["can-bo.html#hd-cb-12", "HD.CB.12"]]]], "SS": [["dn", "Đang lưu", "#5B6B82", "✎", ["Bản nháp, chưa gửi.", "Draft, not sent."], ["Sửa được. Mở lại ở Yêu cầu của tôi - thẻ Đang lưu.", "Editable. Reopen under Yêu cầu của tôi - Đang lưu."]], ["dn", "Chờ phê duyệt", "#F59E0B", "⏳", ["Hồ sơ đã gửi, đang chờ ở một bước của Cơ quan điều hành.", "Sent and waiting at a step of the Operating Authority."], ["Không sửa được; có thể Thu hồi.", "Not editable; can be withdrawn with Thu hồi."]], ["dn", "Yêu cầu bổ sung", "#C0352B", "↩", ["Hồ sơ được trả về để bổ sung.", "Returned for supplement."], ["Sửa được. Mở ở Yêu cầu đã nhận, sửa, Lưu rồi Gửi.", "Editable. Open under Yêu cầu đã nhận, fix, Lưu then Gửi."]], ["dn", "Đã bổ sung", "#0A6FD0", "↪", ["Người nộp đã gửi lại hồ sơ sau khi bổ sung.", "Resubmitted after the supplement."], ["Không sửa được.", "Not editable."]], ["dn", "Đã phê duyệt", "#16A34A", "✓", ["Hồ sơ được xác nhận đầy đủ; Cơ quan điều hành thẩm định, ra quyết định và cấp giấy.", "Confirmed complete; the Authority appraises, decides and issues the certificate."], ["Không cần thao tác thêm.", "No action needed."]], ["dn", "Từ chối", "#C0352B", "✕", ["Hồ sơ bị từ chối.", "The dossier was rejected."], ["Xem lý do trong hồ sơ; nộp hồ sơ mới nếu cần.", "Read the reason in the dossier; submit a new one if needed."]], ["cb", "Thẩm định", "#0A6FD0", "①", ["Giai đoạn của hồ sơ sau khi một cửa xác nhận đầy đủ.", "Dossier stage after the one-stop desk confirms it complete."], ["Giao và làm công việc con, lập Phiếu tiếp nhận.", "Assign and complete sub-tasks, issue the receipt."]], ["cb", "Ra quyết định", "#194792", "②", ["Giai đoạn lập và trình Quyết định.", "Stage for preparing and submitting the decision."], ["Chỉ chuyển được khi mọi công việc con đã hoàn tất.", "Only reachable when every sub-task is done."]], ["cb", "Cấp giấy chứng nhận", "#0F2350", "③", ["Giai đoạn lập các biểu mẫu giấy chứng nhận, làm B1, B3.", "Stage for the certificate forms and sub-tasks B1, B3."], ["Chuyển sang sau khi Quyết định chấp thuận đã được phê duyệt.", "Entered after the approval decision is approved."]], ["cb", "Hoàn thành", "#16A34A", "✓", ["Hồ sơ kết thúc.", "The dossier is closed."], ["Kiểm tra doanh nghiệp đã hiện ở trang Thông tin Thành viên.", "Check the enterprise appears on the Member Information page."]], ["cb", "Chờ thực hiện", "#5B6B82", "○", ["Công việc con chưa bắt đầu.", "Sub-task not started."], ["Chọn người xử lý, rồi chuyển Đang thực hiện.", "Choose a handler, then set Đang thực hiện."]], ["cb", "Đang thực hiện", "#F59E0B", "◐", ["Công việc con đang làm.", "Sub-task in progress."], ["Đính kèm kết quả, ghi Bình luận.", "Attach the result, add a comment."]], ["cb", "Đã hoàn tất", "#16A34A", "●", ["Công việc con đã xong, có giờ hoàn tất.", "Sub-task done, with completion time."], ["Hồ sơ chuyển được giai đoạn khi mọi việc con ở trạng thái này.", "The dossier can move on once all sub-tasks are here."]], ["cb", "Chờ phê duyệt", "#F59E0B", "⏳", ["Phiếu đang chờ người duyệt ở một bước.", "A form waiting for an approver."], ["Người duyệt mở ở QL Yêu Cầu - Cần xử lý.", "Approvers open it under QL Yêu Cầu - Cần xử lý."]], ["cb", "Phê duyệt", "#16A34A", "✓", ["Phiếu đã được duyệt xong, hiện trên hồ sơ kèm giờ duyệt.", "Form fully approved, shown on the dossier with the time."], ["Không sửa được.", "Not editable."]]], "FQ": [["cb", ["Nhà đầu tư chưa có tài khoản để nộp hồ sơ thì làm sao?", "An investor has no account to submit a dossier. What do I do?"], ["Chuyên viên Ban Thành viên tạo doanh nghiệp trong phân hệ Thành viên, rồi thêm tài khoản ở thẻ Tài khoản của doanh nghiệp đó.", "A Member Department officer creates the enterprise in the Thành viên module, then adds an account on its Tài khoản tab."], [["can-bo.html#hd-cb-05", "HD.CB.05"]]], ["cb", ["Nhà đầu tư không nhận được email có tên đăng nhập, mật khẩu.", "The investor did not receive the email with the user name and password."], ["Email có thể đến chậm hoặc vào thư rác. Mở thẻ Tài khoản của doanh nghiệp để kiểm tra Email đã đúng, rồi gửi thẳng tên đăng nhập và mật khẩu cho đầu mối qua kênh riêng, nhắc đổi mật khẩu ở lần đăng nhập đầu.", "The email may be late or in spam. Check the Email on the enterprise's Tài khoản tab, then send the user name and password to the contact through a private channel and ask them to change the password at first sign-in."], [["can-bo.html#hd-cb-05", "HD.CB.05"]]], ["cb", ["Doanh nghiệp đã nộp nhưng tôi không thấy hồ sơ ở QL Hồ sơ.", "The enterprise has submitted but I cannot see the dossier in QL Hồ sơ."], ["Hồ sơ mới nộp nằm ở bước một cửa trước: xem ở QL Yêu Cầu, khung Cần xử lý của người giữ bước đó. Sau khi bấm Hồ sơ đầy đủ, hồ sơ mới hiện ở QL Hồ sơ với trạng thái Thẩm định.", "A new dossier first sits at the one-stop step: look in QL Yêu Cầu, Cần xử lý, of whoever holds that step. Only after Hồ sơ đầy đủ does it appear in QL Hồ sơ with status Thẩm định."], [["can-bo.html#hd-cb-07", "HD.CB.07"], ["can-bo.html#hd-cb-08", "HD.CB.08"]]], ["cb", ["Đổi trạng thái hồ sơ thì báo \"Bạn phải hoàn thành tất cả công việc con trước khi chuyển trạng thái\".", "Changing the dossier status shows \"Bạn phải hoàn thành tất cả công việc con trước khi chuyển trạng thái\"."], ["Còn công việc con chưa xong. Mở từng việc trong phần Công việc con, bấm ô trạng thái và chọn Đã hoàn tất, rồi đổi trạng thái hồ sơ lại.", "A sub-task is still open. Open each one under Công việc con, set its status to Đã hoàn tất, then change the dossier status again."], [["can-bo.html#hd-cb-09", "HD.CB.09"], ["can-bo.html#hd-cb-11", "HD.CB.11"]]], ["cb", ["Tôi không mở hoặc không làm được một công việc con.", "I cannot open or work on a sub-task."], ["Bạn chưa là người xử lý của việc đó. Nhờ chuyên viên phụ trách hồ sơ mở việc con, bấm Chọn người xử lý và thêm bạn vào.", "You are not a handler of that task. Ask the officer in charge of the dossier to open it, click Chọn người xử lý and add you."], [["can-bo.html#hd-cb-08", "HD.CB.08"]]], ["cb", ["Ai giao việc thẩm định, giao cho ai?", "Who assigns appraisal tasks, and to whom?"], ["Chuyên viên Ban Thành viên phụ trách hồ sơ giao. Việc Lấy ý kiến Ban Pháp chế thì thêm Trưởng Ban Pháp chế, Trưởng ban thêm chuyên viên của ban mình. Việc của Ban Thành viên thì chuyên viên tự làm hoặc thêm chuyên viên khác.", "The Member Department officer in charge assigns them. For the Legal Department opinion, add the head of the Legal Department, who adds an officer. Member Department tasks are done by the officer or a colleague they add."], [["can-bo.html#hd-cb-08", "HD.CB.08"]]], ["cb", ["Sau Thẩm định, sau Ra quyết định thì làm gì tiếp?", "What comes after Thẩm định and after Ra quyết định?"], ["Xong các việc con thì chuyển hồ sơ sang Ra quyết định, lập và trình Quyết định. Quyết định được phê duyệt thì chuyển sang Cấp giấy chứng nhận, lập các biểu mẫu, làm B1, B3, rồi chuyển Hoàn thành.", "When the sub-tasks are done, move to Ra quyết định and submit the decision. Once it is approved, move to Cấp giấy chứng nhận, create the forms, complete B1 and B3, then set Hoàn thành."], [["can-bo.html#hd-cb-11", "HD.CB.11"], ["can-bo.html#hd-cb-12", "HD.CB.12"]]], ["cb", ["Trưởng ban, Ban Chủ tịch bấm ở đâu để duyệt?", "Where do heads and the Presidium approve?"], ["Vào QL Yêu Cầu, mở phiếu có nhãn Chờ phê duyệt. Trưởng, Phó ban bấm Đồng ý; Ban Chủ tịch bấm Phê duyệt; rồi chọn Tiếp tục.", "Open QL Yêu Cầu and the form labelled Chờ phê duyệt. Heads click Đồng ý; the Presidium clicks Phê duyệt; then choose Tiếp tục."], [["can-bo.html#hd-cb-13", "HD.CB.13"]]], ["cb", ["Khi gửi phiếu, bước duyệt liệt kê sẵn người của nơi khác và không bỏ được.", "When sending a form, the approval step already lists people from another office."], ["Bấm vào tên bước (chữ xanh) trong hộp Thông tin xử lý. Hộp Chọn người xử lý mở ra: bỏ người không cần, giữ người sẽ duyệt, rồi bấm Đồng ý.", "Click the step name (blue text) in the Thông tin xử lý dialog. In Chọn người xử lý, remove those not needed, keep the approver, then click Đồng ý."], [["can-bo.html#hd-cb-11", "HD.CB.11"], ["can-bo.html#hd-cb-12", "HD.CB.12"]]], ["cb", ["Hệ thống có tự tạo Giấy chứng nhận theo mẫu không?", "Does the system generate the certificate from the template?"], ["Có, ở giai đoạn Cấp giấy chứng nhận. Điền biểu mẫu B2 và các biểu mẫu của giai đoạn này; giấy chứng nhận lấy thông tin từ đó.", "Yes, at the Cấp giấy chứng nhận stage. Fill in form B2 and the other forms of this stage; the certificate takes its data from them."], [["can-bo.html#hd-cb-12", "HD.CB.12"]]], ["cb", ["Hồ sơ đã Hoàn thành nhưng doanh nghiệp chưa hiện ở trang Thông tin Thành viên.", "The dossier is completed but the enterprise is not on the Member Information page."], ["Làm công việc con B3 và lập THÔNG BÁO GIẤY CHỨNG NHẬN ĐẾN THÀNH VIÊN với đầy đủ thông tin. Kiểm tra lại tại member.vifc.gov.vn/member-information.", "Complete sub-task B3 and create the certificate notice to the member with every field filled in. Check again at member.vifc.gov.vn/member-information."], [["can-bo.html#hd-cb-12", "HD.CB.12"]]], ["cb", ["Kiểm tra tên dự kiến của doanh nghiệp có trùng hay không ở đâu?", "Where do I check whether a proposed enterprise name is already taken?"], ["Vào QL Yêu Cầu, bấm Kiểm tra tên công ty, nhập tên riêng (không gồm loại hình) rồi bấm Kiểm tra trùng tên.", "Open QL Yêu Cầu, click Kiểm tra tên công ty, enter the proper name (without the company type) and click Kiểm tra trùng tên."], [["can-bo.html#hd-cb-15", "HD.CB.15"]]], ["cb", ["Tra cứu thông tin một doanh nghiệp theo mã số ở đâu?", "Where do I look up an enterprise by its code?"], ["Dùng mục Tra cứu doanh nghiệp trên thanh bên trái, nhập mã số doanh nghiệp rồi bấm Tìm kiếm Doanh nghiệp.", "Use Tra cứu doanh nghiệp in the left bar, enter the enterprise code and click Tìm kiếm Doanh nghiệp."], [["can-bo.html#hd-cb-06", "HD.CB.06"]]], ["cb", ["Kiểm tra trùng tên báo \"Kiểm tra không thành công\", Timeout.", "The duplicate-name check shows \"Kiểm tra không thành công\" with a timeout."], ["Bấm Thử lại. Dịch vụ tra cứu bên ngoài đôi lúc phản hồi chậm; vẫn lỗi thì thử lại sau ít phút.", "Click Thử lại. The external lookup service is sometimes slow; if it still fails, try again in a few minutes."], [["can-bo.html#hd-cb-15", "HD.CB.15"]]], ["dn", ["Mã ngành: ngành nghề của tôi không có mã trong danh sách.", "Business line code: mine is not in the list."], ["Kéo xuống cuối danh sách, chọn \"No Business line Code Yet\" rồi gõ nội dung ngành nghề.", "Scroll to the end of the list, choose \"No Business line Code Yet\" and type the business line."], [["nguoi-nop.html#hd-dn-07", "HD.DN.07"]]], ["dn", ["Có mục tôi chưa có thông tin để điền.", "I have no information for some fields."], ["Chỉ ô có dấu * đỏ là bắt buộc. Ô không có dấu * có thể để trống.", "Only fields with a red * are required. Others may be left empty."], [["nguoi-nop.html#hd-dn-07", "HD.DN.07"]]], ["dn", ["Bảng trong biểu mẫu báo đỏ, không sang bước tiếp được.", "A table in the form is flagged red and I cannot continue."], ["Bấm dòng chữ đỏ để tới bảng đó, rồi bấm nút lưu ở bên phải từng dòng trước khi bấm Lưu ở trên.", "Click the red text to jump to that table, then press the save button at the right of each row before the top Lưu."], [["nguoi-nop.html#hd-dn-07", "HD.DN.07"]]], ["dn", ["Tôi tải tệp lên xong, mở lại thì mất hết.", "I uploaded files but they were gone when I came back."], ["Tải tệp xong phải bấm Lưu ở thanh trên thì tệp mới được ghi vào hồ sơ.", "After uploading you must press Lưu in the top bar for the files to be stored."], [["nguoi-nop.html#hd-dn-08", "HD.DN.08"], ["nguoi-nop.html#hd-dn-09", "HD.DN.09"]]], ["dn", ["Nộp tệp loại nào? Ảnh, zip có được không?", "Which file types are accepted? Images or zip?"], ["Mục bản quét nộp tệp PDF; mục bản mềm nộp tệp Word để Cơ quan điều hành lấy dữ liệu chính xác. Hệ thống không nhận ảnh và tệp nén; bản chụp thì xuất sang PDF.", "Scanned items take PDF; soft-copy items take Word so data can be extracted accurately. Images and archives are not accepted; export photos to PDF."], [["nguoi-nop.html#hd-dn-08", "HD.DN.08"]]], ["dn", ["Bấm Gửi thì hiện \"Mục đính kèm không chính xác\".", "Clicking Gửi shows \"Mục đính kèm không chính xác\"."], ["Còn mục tài liệu bắt buộc chưa có tệp. Xem dòng đếm ở phần Tài liệu đính kèm và bổ sung các mục có dấu *.", "A required document item has no file. Check the counter in the attachments section and fill the items marked *."], [["nguoi-nop.html#hd-dn-08", "HD.DN.08"], ["nguoi-nop.html#hd-dn-11", "HD.DN.11"]]], ["dn", ["Bấm Kiểm tra hồ sơ hoặc Gửi thì báo lỗi kiểm tra tên công ty.", "Kiểm tra hồ sơ or Gửi reports a company-name check error."], ["Bấm lại lần nữa. Bước này hỏi dịch vụ tra cứu tên bên ngoài, đôi lúc phản hồi chậm.", "Click again. This step calls an external name lookup service that is sometimes slow."], [["nguoi-nop.html#hd-dn-10", "HD.DN.10"], ["nguoi-nop.html#hd-dn-11", "HD.DN.11"]]], ["dn", ["Ô địa chỉ ghi địa chỉ nào?", "Which address goes in the address field?"], ["Địa chỉ của doanh nghiệp, không phải địa chỉ của Cơ quan điều hành.", "The enterprise's own address, not the Operating Authority's."], [["nguoi-nop.html#hd-dn-07", "HD.DN.07"]]], ["dn", ["Tôi gửi rồi, làm sao biết đã thành công?", "I have sent it. How do I know it worked?"], ["Đầu hồ sơ hiện khung TIẾN ĐỘ PHÊ DUYỆT; hồ sơ nằm ở Yêu cầu của tôi, thẻ Đang xử lý.", "The TIẾN ĐỘ PHÊ DUYỆT panel appears at the top; the dossier is under Yêu cầu của tôi, tab Đang xử lý."], [["nguoi-nop.html#hd-dn-13", "HD.DN.13"], ["nguoi-nop.html#hd-dn-12", "HD.DN.12"]]], ["dn", ["Tôi quên mật khẩu.", "I forgot my password."], ["Trang đăng nhập không có nút lấy lại mật khẩu. Mở mục Liên hệ trên thanh trên cùng để đề nghị Cơ quan điều hành cấp lại.", "The sign-in page has no reset button. Use Liên hệ in the top bar to ask the Operating Authority for a new one."], [["nguoi-nop.html#hd-dn-16", "HD.DN.16"]]], ["dn", ["Cơ quan điều hành yêu cầu bổ sung, tôi sửa ở đâu?", "A supplement was requested. Where do I fix the dossier?"], ["Mở Yêu cầu đã nhận, bấm dòng hồ sơ, sửa nội dung và tài liệu, bấm Lưu rồi Gửi.", "Open Yêu cầu đã nhận, click the dossier, fix the content and documents, press Lưu then Gửi."], [["nguoi-nop.html#hd-dn-14", "HD.DN.14"]]], ["dn", ["Tôi nhận kết quả, giấy chứng nhận ở đâu?", "Where do I receive the result and the certificate?"], ["Thông báo giấy chứng nhận được gửi tới mục Yêu cầu đã nhận. Doanh nghiệp cũng hiện ở trang Thông tin Thành viên.", "The certificate notice arrives under Yêu cầu đã nhận. The enterprise is also listed on the Member Information page."], [["nguoi-nop.html#hd-dn-15", "HD.DN.15"]]]], "GL": [["Thành viên", "Member", ["Tổ chức được Cơ quan điều hành công nhận là Thành viên của Trung tâm tài chính quốc tế.", "An organisation recognised by the Operating Authority as a Member of the International Financial Centre."]], ["Người nộp hồ sơ", "Applicant", ["Người dùng tài khoản của doanh nghiệp để kê khai và gửi hồ sơ trên Cổng.", "The person using the enterprise account to fill in and send a dossier on the portal."]], ["Cơ quan điều hành", "Operating Authority", ["Cơ quan tiếp nhận, thẩm định và quyết định hồ sơ đăng ký Thành viên.", "The body that receives, appraises and decides on member registration dossiers."]], ["Cơ quan tiếp nhận", "Receiving office", ["Nơi nhận hồ sơ, chọn khi tạo hồ sơ (Hồ Chí Minh hoặc Đà Nẵng).", "Where the dossier is filed, chosen when creating it (Ho Chi Minh City or Da Nang)."]], ["Cổng", "Portal", ["member.vifc.gov.vn, nơi người nộp làm hồ sơ.", "member.vifc.gov.vn, where applicants work."]], ["Hệ thống nội bộ", "Back office", ["bo.vifc.gov.vn, gồm QL Yêu Cầu, QL Hồ sơ và phân hệ Thành viên, dành cho cán bộ.", "bo.vifc.gov.vn, with QL Yêu Cầu, QL Hồ sơ and the Thành viên module, for officers."]], ["Bộ phận một cửa", "One-stop desk", ["Bước đầu tiên phía cán bộ: soát hồ sơ vừa nộp, xác nhận đầy đủ hoặc yêu cầu bổ sung.", "The first officer step: checks a new dossier, confirms it or requests a supplement."]], ["Ban Thành viên", "Member Department", ["Ban phụ trách hồ sơ đăng ký Thành viên; chuyên viên của ban theo hồ sơ suốt các giai đoạn.", "The department in charge of member dossiers; its officer follows a dossier through all stages."]], ["Ban Pháp chế", "Legal Department", ["Ban cho ý kiến pháp lý ở giai đoạn Thẩm định.", "The department giving the legal opinion during appraisal."]], ["Ban Chủ tịch", "Presidium", ["Cấp phê duyệt cuối của Quyết định, Tờ trình và biểu mẫu B2.", "The final approver of the decision, the submission and form B2."]], ["QL Yêu Cầu", "Requests", ["Nơi lập, gửi và duyệt các phiếu; khung Cần xử lý liệt kê phiếu đang chờ bạn.", "Where forms are created, sent and approved; Cần xử lý lists forms waiting for you."]], ["QL Hồ sơ", "Dossier management", ["Nơi theo dõi hồ sơ theo giai đoạn, công việc con và biểu mẫu liên quan.", "Where dossiers are followed by stage, with sub-tasks and related forms."]], ["Yêu cầu của tôi", "My requests", ["Mục trên Cổng liệt kê hồ sơ người nộp đã tạo.", "Portal menu listing dossiers the applicant created."]], ["Yêu cầu đã nhận", "Received requests", ["Mục trên Cổng chứa việc Cơ quan điều hành chuyển tới người nộp: yêu cầu bổ sung, thông báo giấy chứng nhận.", "Portal menu holding items sent to the applicant: supplement requests, certificate notice."]], ["Phiếu, biểu mẫu", "Form", ["Một yêu cầu lập trên QL Yêu Cầu, đi qua các bước duyệt, ví dụ Phiếu tiếp nhận, Quyết định, Tờ trình.", "A request created in QL Yêu Cầu that goes through approval steps, such as the receipt, the decision or a submission."]], ["Công việc con", "Sub-task", ["Một việc trong một giai đoạn của hồ sơ, có người xử lý và trạng thái riêng.", "A task inside a dossier stage, with its own handlers and status."]], ["Giai đoạn", "Stage", ["Trạng thái của hồ sơ ở QL Hồ sơ: Thẩm định, Ra quyết định, Cấp giấy chứng nhận, Hoàn thành.", "The dossier status in QL Hồ sơ: Thẩm định, Ra quyết định, Cấp giấy chứng nhận, Hoàn thành."]], ["Thông tin xử lý", "Processing information", ["Hộp hiện khi gửi phiếu, liệt kê các bước duyệt và người ở từng bước.", "Dialog shown when sending a form, listing approval steps and people."]], ["Thông tin luân chuyển", "Routing table", ["Bảng cuối phiếu ghi từng bước: người xử lý, giờ, hành động, ý kiến.", "Table at the bottom of a form recording each step: handler, time, action, comment."]], ["TIẾN ĐỘ PHÊ DUYỆT", "Approval progress", ["Khung ở đầu hồ sơ trên Cổng cho biết hồ sơ đang ở bước nào.", "Panel at the top of a dossier on the portal showing the current step."]], ["Phiếu tiếp nhận hồ sơ", "Dossier receipt", ["Phiếu ghi ngày tiếp nhận và ngày hẹn trả kết quả.", "Form recording the reception date and the promised result date."]], ["Quyết định chấp thuận", "Approval decision", ["Quyết định chấp thuận đăng ký Thành viên, do chuyên viên lập và Ban Chủ tịch phê duyệt.", "The decision approving the registration, prepared by the officer and approved by the Presidium."]], ["B2", "B2", ["Biểu mẫu Kiểm tra và xác nhận thông tin giấy chứng nhận.", "The form checking and confirming the certificate information."]], ["B1, B3", "B1, B3", ["Hai công việc con của giai đoạn Cấp giấy chứng nhận. B3 là Cập nhật sổ đăng ký thành viên và Công bố.", "Two sub-tasks of the certificate stage. B3 updates the member register and publishes it."]], ["Thông tin Thành viên", "Member Information", ["Trang công khai danh sách Thành viên: member.vifc.gov.vn/member-information.", "Public page listing members: member.vifc.gov.vn/member-information."]]], "UI": {"vi": {"title": "Trang chung", "sub": "Đường đi của hồ sơ, trạng thái, câu hỏi thường gặp, thuật ngữ, liên hệ", "nav": ["Đường đi của hồ sơ", "Trạng thái", "Câu hỏi và lỗi thường gặp", "Thuật ngữ", "Liên hệ"], "r": ["Người nộp hồ sơ", "Cán bộ", "Chung"], "hold": "Ai giữ", "where": "Xem ở đâu", "btn": "Nút, thao tác", "app": "Người nộp thấy", "see": "Thẻ việc", "flowp": "Bấm từng chặng để xem ai giữ hồ sơ và bấm nút gì.", "all": "Tất cả", "dn": "Người nộp", "cb": "Cán bộ", "find": "Tìm câu hỏi, gõ không dấu cũng được", "none": "Không có câu hỏi khớp.", "st": ["Trạng thái", "Nghĩa là", "Làm gì tiếp"], "sdn": "Người nộp thấy trên Cổng", "scb": "Cán bộ thấy trên hệ thống nội bộ", "gl": ["Thuật ngữ", "Tiếng Anh", "Nghĩa"], "foot": "vifc.gov.vn | Ban Công nghệ", "ct": [["Người nộp hồ sơ", "Dùng mục Liên hệ trên thanh trên cùng của member.vifc.gov.vn để gửi câu hỏi tới Cơ quan điều hành."], ["Cán bộ", "Lỗi về quyền, tài khoản, người duyệt trong biểu mẫu: liên hệ Ban Công nghệ - Cơ quan điều hành Trung tâm tài chính quốc tế tại Thành phố Hồ Chí Minh, kèm mã hồ sơ hoặc mã phiếu và ảnh màn hình."], ["Góp ý cho bộ hướng dẫn", "Gửi Ban Công nghệ - Cơ quan điều hành Trung tâm tài chính quốc tế tại Thành phố Hồ Chí Minh, ghi mã thẻ việc (ví dụ HD.CB.08) và bước cần sửa."]]}, "en": {"title": "Common pages", "sub": "Dossier journey, statuses, frequent questions, glossary, contact", "nav": ["Dossier journey", "Statuses", "Questions and common errors", "Glossary", "Contact"], "r": ["Applicant", "Officers", "Common"], "hold": "Who holds it", "where": "Where to look", "btn": "Buttons, actions", "app": "What the applicant sees", "see": "Task cards", "flowp": "Click a stage to see who holds the dossier and which buttons they use.", "all": "All", "dn": "Applicant", "cb": "Officers", "find": "Search questions", "none": "No matching question.", "st": ["Status", "Meaning", "What next"], "sdn": "Seen by the applicant on the portal", "scb": "Seen by officers in the back office", "gl": ["Term (Vietnamese)", "English", "Meaning"], "foot": "vifc.gov.vn | Technology Department", "ct": [["Applicants", "Use Liên hệ (contact) in the top bar of member.vifc.gov.vn to send a question to the Operating Authority."], ["Officers", "Permission, account or approver issues in a form: contact the Technology Department - Operating Authority of the International Financial Centre in Ho Chi Minh City, with the dossier or form code and a screenshot."], ["Feedback on this guide", "Send it to the Technology Department - Operating Authority of the International Financial Centre in Ho Chi Minh City, quoting the task card code (for example HD.CB.08) and the step."]]}}},lang='vi',si=0,ff='all';
function $(i){return document.getElementById(i)}function L(){return lang=='vi'?0:1}
