<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hướng dẫn sử dụng DKTV - Cán bộ xử lý hồ sơ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0F2350;--blue:#194792;--blue2:#0A6FD0;--cyan:#00A9E8;--orange:#F59E0B;--green:#16A34A;--red:#C0352B;--ink:#1F2937;--muted:#5B6B82;--tint:#EAF3FC;--line:#C9D7EA}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;background:#fff}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px}.top img{height:38px}.top .sp{flex:1}.crumb{font-size:12.5px;color:var(--muted)}
.lang button{font:700 12px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:6px 12px;cursor:pointer}.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}.lang button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 0}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
h1{margin:4px 0 6px;font-size:26px;text-transform:uppercase;color:var(--navy)}.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:4px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.pur{margin:0 0 18px;font-size:16px}.pur b{color:var(--blue)}
.grid{display:grid;grid-template-columns:minmax(320px,.8fr) 1.4fr;gap:22px;align-items:start}
.card{background:var(--tint);border-radius:14px;padding:18px}.card h2{margin:0 0 6px;font-size:15px;color:var(--navy);text-transform:uppercase}
ol{list-style:none;padding:0;margin:0;counter-reset:s}ol li{counter-increment:s;position:relative;padding:10px 12px 10px 46px;border-radius:10px;cursor:pointer;font-size:14px}ol li:before{content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--cyan);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
ol li.on{background:#fff;box-shadow:0 2px 8px rgba(15,35,80,.12)}ol li.on:before{background:var(--orange)}
.btn{font-weight:700;font-size:12.5px;color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;padding:0 6px;background:#fff}
.done{margin-top:12px;border-left:4px solid var(--green);background:#fff;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;cursor:pointer}.done.on{box-shadow:0 2px 8px rgba(15,35,80,.12)}.done>b:first-child{color:var(--green)}
.warn{margin-top:10px;border-left:4px solid var(--red);background:#fff;border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px}
.fig{position:sticky;top:64px;background:var(--blue);border-radius:14px;padding:16px;color:#fff;box-shadow:0 6px 18px rgba(15,35,80,.25)}.fig .eyebrow{color:var(--orange)}
.shot{position:relative;margin-top:8px;border-radius:8px;overflow:hidden;background:#fff}.shot img{display:block;width:100%}
.hl{position:absolute;border:3px solid var(--orange);border-radius:6px;box-shadow:0 0 0 2000px rgba(15,35,80,.18);transition:all .25s}.hl i{position:absolute;top:-13px;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font:700 12px Montserrat,sans-serif;display:grid;place-items:center}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs button{font:700 12px Montserrat,sans-serif;border:1.5px solid #fff;background:transparent;color:#fff;padding:5px 12px;cursor:pointer}.tabs button:first-child{border-radius:8px 0 0 8px}.tabs button:last-child{border-radius:0 8px 8px 0;border-left:0}.tabs button[aria-pressed=true]{background:#fff;color:var(--blue)}.vid{margin-top:8px;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9}.vid iframe{width:100%;height:100%;border:0;display:block}.cap{font-size:12px;color:#D6E8FA;margin-top:8px}.clip{margin-top:10px;font-size:12.5px;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 12px}
h3{font-size:17px;text-transform:uppercase;color:var(--navy);margin:34px 0 8px}table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--red);color:#fff;text-align:left;padding:9px 12px}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.see{color:var(--blue);font-weight:600;font-size:14px}footer{margin-top:44px;position:relative;height:50px}footer:before{content:"";position:absolute;inset:0 0 0 12%;background:linear-gradient(90deg,#1B5FC0,#194792 40%,#12336F);clip-path:polygon(28px 0,100% 0,100% 100%,0 100%)}footer div{position:absolute;right:26px;top:16px;color:#fff;font-size:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.fig{position:static;order:-1}h1{font-size:20px}.crumb{display:none}}
.pick{max-width:1240px;margin:0 auto;padding:14px 20px 0}.pick h2{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.grp{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}.grp span{font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;min-width:112px}.grp button{font:600 12.5px Montserrat,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:5px 12px;cursor:pointer}.grp button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}#trw[hidden],#tClip[hidden],#clip[hidden],#warn[hidden]{display:none}
</style></head><body>
